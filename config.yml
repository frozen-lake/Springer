token: "provided-at-runtime"
url: "https://lichess.org/"

engine:
  dir: "/opt/springer"
  name: "springer-uci"
  working_dir: "/tmp"
  protocol: "uci"
  ponder: false
  uci_options: {}
  polyglot:
    enabled: false
  draw_or_resign:
    resign_enabled: false
    offer_draw_enabled: false

move_overhead: 1000
quit_after_all_games_finish: true

challenge:
  concurrency: 2
  games_reserved_for_humans: 1
  preference: "human"
  accept_bot: true
  only_bot: false
  variants:
    - standard
  time_controls:
    - bullet
    - blitz
    - rapid
  modes:
    - casual
  rated_block_list:
    - derge
  min_base: 60
  max_base: 900
  min_increment: 0
  max_increment: 10
  bullet_requires_increment: false

matchmaking:
  allow_matchmaking: true
  allow_during_games: true
  challenge_mode: "rated"
  challenge_variant: "standard"
  opponent_rating_difference: 200
  challenge_initial_time: [180]
  challenge_increment: [0, 2]
  challenge_timeout: 2
  challenge_filter: "coarse"
