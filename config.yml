token: "provided-at-runtime"
url: "https://lichess.org/"

engine:
  dir: "/opt/springer"
  name: "springer-uci"
  working_dir: "/tmp"
  protocol: "uci"
  ponder: false
  uci_options: {}
  polyglot:
    enabled: false
  draw_or_resign:
    resign_enabled: false
    offer_draw_enabled: false

move_overhead: 1000
quit_after_all_games_finish: true

challenge:
  concurrency: 1
  accept_bot: true
  only_bot: false
  variants:
    - standard
  time_controls:
    - bullet
    - blitz
    - rapid
  modes:
    - casual
  # Springer-specific (enforced by extra_game_handlers.py): rated challenges from these
  # users are declined, casual ones are still accepted. List the owner's own accounts
  # here so they can never play rated games against the bot (boosting).
  rated_block_list:
    - derge
  min_base: 60
  max_base: 900
  min_increment: 0
  max_increment: 10
  bullet_requires_increment: false

matchmaking:
  allow_matchmaking: true
  challenge_mode: "rated"
  challenge_variant: "standard"
  opponent_min_rating: 1400
  opponent_max_rating: 1900
  challenge_initial_time: [60, 120, 180]
  challenge_increment: [0, 1]
  challenge_timeout: 3
  challenge_filter: "coarse"
